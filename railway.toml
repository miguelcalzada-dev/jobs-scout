[build]
  builder = "nixpacks"
  buildCommand = "pip install -r requirements.txt"

[deploy]
  startCommand = "python3 src/main.py --port 8080"
  healthcheckPath = "/health"
  healthcheckTimeout = 10
  restartPolicyMaxRetries = 5

[service]
  name = "jobs-scout"

[variable]
  TZ = "Europe/Madrid"
  PORT = "8080"
